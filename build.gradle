plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.honeyRest'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 기본 웹 애플리케이션 구성
    implementation 'org.springframework.boot:spring-boot-starter-web' // REST API 및 MVC 웹 기능
    implementation 'org.springframework.boot:spring-boot-starter-validation' // Bean Validation (예: @Valid)

    // 데이터 접근
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA 기반 ORM

    // 코드 간결화
    compileOnly 'org.projectlombok:lombok' // Getter/Setter/Builder 등 자동 생성
    annotationProcessor 'org.projectlombok:lombok' // 컴파일 시 Lombok 처리

    // DTO ↔ Entity 변환
    implementation 'org.mapstruct:mapstruct:1.6.2' // 타입 매핑 자동화
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2' // MapStruct 컴파일러

    // 보안 및 인증
    implementation 'org.springframework.boot:spring-boot-starter-security' // Spring Security 기본 설정

    // API 문서화
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0' // Swagger UI 및 OpenAPI 문서 자동 생성

    // 캐시 및 성능 향상
    implementation 'org.springframework.boot:spring-boot-starter-cache' // 캐시 추상화 (Redis 등과 연동 가능)
    // 사용자 API 와 공유하는 Redis: 호스트는 검색 캐시 세대 번호(search:recommend:version) INCR 에만 쓴다 (Lettuce).
    // app.cache.redis.enabled=false(기본값)이면 Redis 에 접속하지 않는다 (SearchCacheConfig 참고).
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 시스템 모니터링
    implementation 'org.springframework.boot:spring-boot-starter-actuator' // 애플리케이션 상태 및 지표 확인

    // 복잡한 쿼리 작성
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta' // 타입 안전한 JPQL 생성
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta' // Querydsl 코드 생성기
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api' // 어노테이션 API
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api' // JPA 어노테이션 API

    // Firebase 연동 (app.storage.type=firebase 일 때만 사용)
    implementation 'com.google.firebase:firebase-admin:9.2.0' // Firebase Admin SDK (Storage)

    // 개발 편의성
    developmentOnly 'org.springframework.boot:spring-boot-devtools' // 자동 리스타트, 캐시 무효화 등

    // DB 드라이버
    runtimeOnly 'com.mysql:mysql-connector-j' // MySQL JDBC 드라이버
    runtimeOnly 'com.h2database:h2' // 인메모리 DB (MySQL 모드): test 프로필, screenshot 프로필(DB 없이 화면 보기)에서 사용

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test' // MockMvc user()/csrf() (메서드 보안 403 테스트)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // 테스트 런처

    // 테스트 환경에서도 Lombok 사용
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // 스키마 통합 테스트 (integrationTest 태스크 전용): Docker 로 MySQL 8.0 을 띄우고
    // 사용자 API 저장소의 Flyway 마이그레이션을 적용한 뒤 호스트 엔티티를 ddl-auto=validate 로 검증한다.
    // Flyway 는 마이그레이션 적용 도구로 테스트에서만 쓴다 (호스트 앱은 마이그레이션을 소유하지 않는다).
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-mysql'

    // HTML 템플릿 엔진 Thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.1.0'

    // https://mvnrepository.com/artifact/org.modelmapper/modelmapper <- ModelMapper
    implementation("org.modelmapper:modelmapper:3.2.0")

    // JJWT (0.12.x 계열)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.5'

}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// 기본 test: H2(test 프로필) 기반의 빠른 테스트만 실행한다. Docker 가 필요한 integration 태그는 제외.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// integrationTest: @Tag("integration") 테스트만 실행한다 (Testcontainers MySQL 8.0).
// - 사용자 API 마이그레이션 위치: HONEYREST_USER_MIGRATIONS(환경변수 또는 -P 프로퍼티) → 없으면 ../honeyRest_user/...
// - Docker 가 없으면 해당 테스트는 건너뛴다(skip). CI 에서는 INTEGRATION_REQUIRE_DOCKER=true 로
//   Docker/마이그레이션 부재를 skip 이 아닌 실패로 만든다.
// 실행: ./gradlew test integrationTest
tasks.register('integrationTest', Test) {
    description = '사용자 API 의 Flyway 마이그레이션으로 만든 MySQL 스키마에 대해 호스트 엔티티 validate 를 검증한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    systemProperty 'integration.requireDocker',
            providers.environmentVariable('INTEGRATION_REQUIRE_DOCKER').getOrElse('false')
    def userMigrations = providers.gradleProperty('HONEYREST_USER_MIGRATIONS')
            .orElse(providers.environmentVariable('HONEYREST_USER_MIGRATIONS'))
            .getOrElse('')
    if (userMigrations) {
        systemProperty 'HONEYREST_USER_MIGRATIONS', userMigrations
    }
    shouldRunAfter tasks.named('test')
}
