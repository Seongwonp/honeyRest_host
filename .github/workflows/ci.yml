# 호스트 백엔드 CI: main 브랜치 push/PR 마다 빌드 + 테스트 실행
# - 공유 도메인 모듈(JPA 엔티티)과 Flyway 마이그레이션은 사용자 API 저장소(Seongwonp/honeyRest_user)에 있고,
#   이 저장소는 그것을 git submodule(libs/honeyrest-user) + Gradle composite build 로 가져온다.
#   → 체크아웃 시 submodules: recursive 가 없으면 settings.gradle 단계에서 빌드가 실패한다.
# - test: test 프로필(H2 인메모리)을 쓰므로 MySQL 등 외부 서비스가 필요 없다.
# - integrationTest: 서브모듈의 Flyway 마이그레이션을 Testcontainers MySQL 8.0 에 적용한 뒤
#   공유 엔티티 + 호스트 전용 엔티티를 ddl-auto=validate 로 검증한다.
# - 예약 실행(schedule)/수동 실행(workflow_dispatch)에서는 서브모듈을 사용자 저장소 main 최신으로 올려서 검증한다.
#   고정된 커밋이 아니라 "다음 재고정(re-pin) 대상" 과의 호환성을 매일 확인하기 위함이다.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 18 * * *' # 매일 03:17 KST (UTC 18:17)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃 (서브모듈 포함)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 서브모듈을 사용자 저장소 main 최신으로 갱신 (예약/수동 실행만)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git submodule update --remote --recursive libs/honeyrest-user
          git -C libs/honeyrest-user log --oneline -1

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            *.gradle*
            gradle/wrapper/gradle-wrapper.properties
            libs/honeyrest-user/*.gradle*
            libs/honeyrest-user/honeyrest-domain/*.gradle*

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 및 테스트 (H2)
        run: ./gradlew build --no-daemon

      - name: 스키마 교차 검증 (서브모듈 마이그레이션 + 호스트 validate, Testcontainers MySQL 8.0)
        env:
          # 기본값(libs/honeyrest-user/src/main/resources/db/migration)을 쓴다. 다른 위치를 검증하려면
          # HONEYREST_USER_MIGRATIONS 로 재정의할 수 있다.
          # Docker/마이그레이션 디렉터리가 없으면 skip 이 아니라 실패하도록 강제한다.
          INTEGRATION_REQUIRE_DOCKER: 'true'
        run: ./gradlew integrationTest --no-daemon

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
