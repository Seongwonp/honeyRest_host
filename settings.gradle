rootProject.name = 'honeyRest_host'

// 공유 도메인 모듈(JPA 엔티티, ReservationStatus 등 com.honeyrest.domain.*)은 사용자 API 저장소(honeyRest_user)의
// :honeyrest-domain 서브프로젝트에 있다. 이 저장소는 그것을 git submodule(libs/honeyrest-user)로 두고
// composite build 로 포함해, 좌표 com.honeyrest:honeyrest-domain 을 그 프로젝트로 치환한다 (Maven 배포 없음).
//
// 위치 재정의: -PhoneyrestUserDir=<경로> 또는 환경변수 HONEYREST_USER_DIR
//   예) 두 저장소를 나란히 두고 사용자 저장소의 커밋 전 변경을 바로 확인할 때: ./gradlew test -PhoneyrestUserDir=../honeyRest_user
def honeyrestUserDir = providers.gradleProperty('honeyrestUserDir')
        .orElse(providers.environmentVariable('HONEYREST_USER_DIR'))
        .getOrElse('libs/honeyrest-user')

if (!file("${honeyrestUserDir}/honeyrest-domain/build.gradle").exists()) {
    throw new GradleException(
            "공유 도메인 모듈을 찾을 수 없습니다: ${file(honeyrestUserDir)}/honeyrest-domain\n" +
            "  - 서브모듈 초기화: git submodule update --init --recursive\n" +
            "  - 서브모듈이 honeyrest-domain 도입 이전 커밋을 가리키면 재고정(re-pin)이 필요합니다 (README 참고).")
}

includeBuild(honeyrestUserDir) {
    dependencySubstitution {
        substitute module('com.honeyrest:honeyrest-domain') using project(':honeyrest-domain')
    }
}
