# test 프로필 전용 설정.
# honeyrest_db(개발용 실 DB)와 분리된 스키마를 사용해 테스트가 DataInitializer의 계정 시드를 포함해
# 실제 DB에 영향을 주지 않도록 한다. Flyway 마이그레이션이 없으므로 ddl-auto=update로 스키마를 직접 생성한다.
spring.config.import=optional:application_security.properties

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/honeyrest_host_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=update
