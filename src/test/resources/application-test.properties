# test 프로필 전용 설정.
# 외부 서비스(MySQL, 비밀 설정 파일, Firebase) 없이 ./gradlew test 가 통과하도록
# H2 인메모리 DB(MySQL 호환 모드)를 사용하고, 스키마는 엔티티 매핑으로 매번 새로 만든다.
# (Flyway 마이그레이션이 없으므로 운영의 ddl-auto=validate 대신 create-drop 사용)
spring.config.import=optional:application_security.properties

# ---- DB: H2 (MySQL 모드) ----
# NON_KEYWORDS=USER: 엔티티 테이블명 `user` 가 H2 예약어라서 식별자로 허용한다 (MySQL 에서는 문제 없음)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:honeyrest_host;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Flyway 는 integrationTest 에서 사용자 API 마이그레이션을 적용하는 도구로만 테스트 클래스패스에 있다.
# 호스트 앱은 마이그레이션을 소유하지 않으므로 자동 설정(FlywayAutoConfiguration)은 끈다.
spring.flyway.enabled=false

# ---- 비밀값: 테스트용 더미 (application_security.properties 가 없어도 컨텍스트가 뜨도록, 현재 필수값은 jwt.secret 뿐) ----
# HS256 서명 키는 최소 32바이트 이상이어야 한다.
jwt.secret=test-only-dummy-jwt-secret-key-0123456789-abcdefghijklmnop

# ---- 파일 저장소: 로컬 (FirebaseConfig 비활성) ----
app.storage.type=local
app.storage.local.dir=build/test-uploads

# 테스트 로그는 파일로 남기지 않는다
logging.file.name=

# ---- Redis: 사용하지 않음 (검색 캐시 무효화는 No-op, Redis 없이 테스트) ----
app.cache.redis.enabled=false
