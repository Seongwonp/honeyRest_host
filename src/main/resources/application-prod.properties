# =============================================================================
# 운영(prod) 프로필 — 단일 서버 Docker 배포용 (honeyRest_user 저장소 deploy/docker-compose.yml 의 host-admin 서비스)
# 실행: SPRING_PROFILES_ACTIVE=prod java -jar app.jar
#       데모 계정까지 만들려면 SPRING_PROFILES_ACTIVE=prod,local-demo + DEMO_COMPANY_PASSWORD / DEMO_ADMIN_PASSWORD
#
# 원칙
#   - 비밀값·접속 정보는 전부 환경변수로 받는다. 이 파일에는 비밀값이 없으므로 커밋해도 된다.
#   - 필수(없으면 기동 실패가 맞는 값): DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
#   - 스키마는 사용자 API 의 Flyway 가 소유한다. 호스트는 validate 만 하므로 사용자 API 가 먼저 떠 있어야 한다
#     (docker-compose 의 depends_on: user-api: condition: service_healthy).
# =============================================================================

server.port=${SERVER_PORT:8081}
# Caddy(리버스 프록시)가 보내는 X-Forwarded-Proto 를 신뢰 → request.getScheme() == https
# → 로그인 시 ACCESS_TOKEN 쿠키와 CSRF 쿠키에 Secure 가 붙는다. (Tomcat RemoteIpValve, 사설 대역 프록시만 신뢰)
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---- DB (MySQL 8.0, 사용자 API 와 같은 스키마) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---- Redis (사용자 API 검색 캐시 세대 번호 INCR 전용) ----
app.cache.redis.enabled=${APP_CACHE_REDIS_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# ---- 비밀값 ----
# HS256 키: 32바이트 이상 필요 (setup.sh 가 openssl rand 로 생성). 사용자 API 와 다른 값을 쓴다.
jwt.secret=${JWT_SECRET}

# ---- 파일 저장소: 로컬 디스크 (Docker 볼륨 uploads, 사용자 API 와 공유) ----
# 관리자가 올린 숙소/객실 이미지(/uploads/...)를 사용자 사이트에서도 같은 경로로 보여 주기 위해 같은 볼륨을 쓴다.
app.storage.type=local
app.storage.local.dir=${APP_STORAGE_LOCAL_DIR:/app/uploads}

# ---- 데모 계정 (local-demo 프로필을 함께 켰을 때만 사용, config/DataInitializer) ----
# prod 에서는 코드의 기본 비밀번호(company1234/admin1234)를 절대 쓰지 않는다: 비어 있으면 해당 계정 생성을 건너뛴다.
demo.company-admin.password=${DEMO_COMPANY_PASSWORD:}
demo.super-admin.password=${DEMO_ADMIN_PASSWORD:}

# ---- 로그: 컨테이너 표준 출력만 (docker compose logs 로 확인) ----
logging.file.name=

# ---- 헬스 체크 (docker-compose healthcheck: GET /actuator/health) ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
