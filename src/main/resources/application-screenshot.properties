# screenshot 프로필: MySQL 없이 관리자 화면만 띄워 보기 위한 실행 전용 설정.
#   ./gradlew bootRun --args='--spring.profiles.active=screenshot,local-demo'
# - H2 인메모리 DB(MySQL 모드) + 엔티티 매핑으로 스키마 생성(create-drop)
# - db/screenshot-seed.sql 로 업체/숙소/객실/예약/리뷰/결제 데모 데이터 적재
# - local-demo 프로필을 함께 켜야 DataInitializer 가 로그인용 데모 계정을 만든다
# 운영/개발 DB 에는 절대 사용하지 않는다 (재시작하면 모든 데이터가 사라짐).

server.port=8081

# ---- DB: H2 (MySQL 모드) ----
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:honeyrest_screenshot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---- 데모 데이터 ----
# Hibernate 가 스키마를 만든 뒤에 SQL 을 실행하도록 지연시킨다.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/screenshot-seed.sql
spring.sql.init.encoding=UTF-8

# ---- 비밀값: 화면 확인용 더미 (application_security.properties 없이 기동) ----
jwt.secret=screenshot-only-dummy-jwt-secret-key-0123456789-abcdefghijkl

# ---- 파일 저장소: 로컬 ----
app.storage.type=local
app.storage.local.dir=./uploads

# 로그는 콘솔로만
logging.file.name=

# MySQL 전용 네이티브 쿼리(DATE_ADD ... INTERVAL, DATE_FORMAT 등)를 H2 에서 실행하기 위한 치환기
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.honeyrest.honeyrest_host.config.screenshot.H2MySqlCompat

# ---- Redis: 사용하지 않음 (검색 캐시 무효화는 No-op) ----
app.cache.redis.enabled=false
