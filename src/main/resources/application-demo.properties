# =============================================================================
# demo 프로필 — Render 무료 플랜 관리자 데모 (Dockerfile.render)
# 실행: SPRING_PROFILES_ACTIVE=demo java -jar app.jar
# screenshot 프로필 구성(H2 + 시드)에 Render 포트·프록시 설정과 데모 계정 안내를 더한다.
# 사용자 사이트와 DB 가 분리돼 있고, 재시작하면 데이터가 시드 상태로 돌아간다.
# =============================================================================

server.port=${PORT:8081}
# Render 프록시 IP 대역을 알 수 없으므로 framework 전략(ForwardedHeaderFilter)으로 X-Forwarded-* 를 신뢰한다.
server.forward-headers-strategy=framework
# 0.1 CPU / 512MB: 요청 스레드를 줄여 스택 메모리를 아낀다
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
server.tomcat.threads.min-spare=2

# ---- DB: H2 (MySQL 모드) — screenshot 프로필과 같은 설정 ----
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:honeyrest_demo_admin;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.hibernate.ddl-auto=create-drop
# 스키마는 엔티티로 만든다 (Flyway 는 사용자 API 소유 — 클래스패스에 있어도 실행하지 않음)
spring.flyway.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# MySQL 전용 네이티브 쿼리(DATE_ADD ... INTERVAL, DATE_FORMAT 등)를 H2 에서 실행하기 위한 치환기
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.honeyrest.honeyrest_host.config.screenshot.H2MySqlCompat

# ---- 데모 데이터 (screenshot 시드 재사용, 날짜는 CURRENT_DATE 기준 상대값) ----
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/screenshot-seed.sql
spring.sql.init.encoding=UTF-8

# ---- 데모 계정 (config/DataInitializer) ----
# 비어 있으면 해당 계정 묶음을 만들지 않는다. render.yaml 에서 문서에 공개한 데모용 값을 넣는다.
demo.company-admin.password=${DEMO_COMPANY_PASSWORD:}
demo.super-admin.password=${DEMO_ADMIN_PASSWORD:}

# 로그인 화면 안내 (이메일은 DataInitializer 의 고정 계정과 같아야 한다. 비밀번호가 비면 안내하지 않음)
# 업체 관리자 (허니레스트 스테이)  (properties 파일은 ISO-8859-1로 읽혀 한글이 깨지므로 유니코드 이스케이프로 저장)
app.demo.login-accounts[0].label=\uc5c5\uccb4 \uad00\ub9ac\uc790 (\ud5c8\ub2c8\ub808\uc2a4\ud2b8 \uc2a4\ud14c\uc774)
app.demo.login-accounts[0].email=contact@honeyrest.com
app.demo.login-accounts[0].password=${demo.company-admin.password}
# 최고 관리자  (properties 파일은 ISO-8859-1로 읽혀 한글이 깨지므로 유니코드 이스케이프로 저장)
app.demo.login-accounts[1].label=\ucd5c\uace0 \uad00\ub9ac\uc790
app.demo.login-accounts[1].email=admin@honeyrest.com
app.demo.login-accounts[1].password=${demo.super-admin.password}

# ---- 비밀값: 데모용 ----
# JWT_SECRET 은 render.yaml 에서 generateValue 로 만든다. 로컬 실행용 기본값은 더미(>= 32바이트).
jwt.secret=${JWT_SECRET:demo-only-dummy-jwt-secret-key-0123456789-abcdefghijkl}
toss.secret-key=

# ---- 파일 저장소: 로컬 (이미지에 /app/uploads/placeholder 포함, 업로드 파일은 재시작 시 사라짐) ----
app.storage.type=local
app.storage.local.dir=${APP_STORAGE_LOCAL_DIR:./uploads}

# ---- Redis: 사용하지 않음 (검색 캐시 무효화는 No-op) ----
app.cache.redis.enabled=false

# ---- 헬스 체크 (render.yaml healthCheckPath: /actuator/health — SecurityConfig 에서 permitAll) ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.diskspace.enabled=false

# ---- 로그: 콘솔만 (컨테이너 디스크에 파일을 남기지 않음) ----
logging.file.name=
