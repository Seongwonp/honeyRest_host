# Application name
spring.application.name=honeyRest_host

# Server port
server.port=${SERVER_PORT:8081}

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/honeyrest_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# cloud = tjfgusdh
# normal = honeyRest_host
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.username=root
# spring.datasource.password defined in application_security.properties

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cache configuration
spring.cache.type=simple

# ---- Redis (사용자 API 와 공유) ----
# 호스트는 Redis 를 캐시 저장소로 쓰지 않고, 사용자 API 검색 캐시의 세대 번호(search:recommend:version)를
# 예약/객실/숙소/가격 변경 커밋 후 INCR 하는 데만 쓴다 (cache.SearchCacheInvalidator).
# false 면 No-op 구현이 등록되어 Redis 에 접속하지 않는다 (test/screenshot 프로필은 false 로 고정).
app.cache.redis.enabled=${APP_CACHE_REDIS_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
# 비밀번호가 필요하면 application_security.properties 에 spring.data.redis.password 로 둔다
# Redis 장애 시 커밋 후 콜백이 요청 스레드를 오래 붙잡지 않도록 짧게 둔다 (실패는 경고 로그만 남김)
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=2s
# Redis 는 Spring Data 저장소(repository)로 쓰지 않는다 (JPA 저장소와의 모듈 판별 경고 방지)
spring.data.redis.repositories.enabled=false
# Redis 를 끈 환경에서 /actuator/health 가 DOWN 이 되지 않도록 헬스 체크도 같은 스위치를 따른다
management.health.redis.enabled=${app.cache.redis.enabled}

# Swagger (API documentation)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# 파일 저장소 설정
# local(기본값): ./uploads 디렉터리에 저장하고 /uploads/** 로 서빙 (Firebase 키 불필요)
# firebase     : Firebase Storage 사용 (app.firebase.credentials 의 서비스 계정 키 필요)
app.storage.type=local
app.storage.local.dir=./uploads
#app.firebase.credentials=classpath:honeyrest-7fb60-firebase-adminsdk-fbsvc-70bafb1ad4.json
#app.firebase.bucket=honeyrest-7fb60.firebasestorage.app

# Logging configuration
logging.level.root=info
logging.level.org.springframework=info
logging.level.org.springframework.web=warn
logging.level.org.springframework.security=warn
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=warn
logging.level.org.thymeleaf=warn
logging.level.com.honeyrest=info

# 파일 로깅 (에러 추적용)
logging.file.name=logs/honeyrest.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.file-name-pattern=logs/honeyrest.%d{yyyy-MM-dd}.%i.log


# Import secret configuration file
spring.config.import=optional:application_security.properties

# JWT configuration
jwt.expiration-ms=3600000

# S3 ???? ?
spring.cloud.aws.s3.enabled=false

# (??? ??? ???? ???)
spring.autoconfigure.exclude=io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
