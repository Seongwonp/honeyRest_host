<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{owner/layout/base}">
<head>
    <title>리뷰 답글</title>
</head>
<body>
<!--
  총관리자 리뷰 답글·노출 관리.
  과거 폼은 리뷰 작성자의 평점·본문·예약 ID·작성자 ID 까지 고치게 돼 있었고, 존재하지 않는 /owner/review/modify 로 제출됐다.
  리뷰 본문은 작성자 소유이므로 읽기 전용으로 보여 주고, 답글과 노출 상태만 저장한다.
-->
<th:block layout:fragment="content">
    <div class="toolbar">
        <div class="d-flex align-items-center gap-2">
            <h3 class="mb-0">리뷰 답글</h3>
            <span class="count-badge" th:text="'#' + ${review.reviewId}">#1</span>
        </div>
        <a th:href="@{/owner/review/list(accommodationId=${review.accommodationId})}" class="btn btn-soft btn-chip">목록으로</a>
    </div>

    <div class="card shadow-sm mb-4 p-4">
        <div class="row g-3">
            <div class="col-md-4">
                <div class="text-muted small">숙소 / 객실</div>
                <div class="fw-semibold" th:text="${review.accommodationName}">숙소명</div>
                <div class="text-muted small" th:text="${review.roomName}">객실명</div>
            </div>
            <div class="col-md-4">
                <div class="text-muted small">작성자</div>
                <div class="fw-semibold" th:text="${review.userName ?: '-'}">홍길동</div>
                <div class="text-muted small"
                     th:text="${review.createdAt != null ? #temporals.format(review.createdAt,'yyyy-MM-dd HH:mm') : '-'}">2025-01-01</div>
            </div>
            <div class="col-md-4">
                <div class="text-muted small">평점</div>
                <div class="fw-bold" style="color:#F59E0B;" th:text="${review.rating != null ? review.rating + ' ★' : '-'}">5 ★</div>
                <div class="text-muted small"
                     th:text="|청결 ${review.cleanlinessRating ?: '-'} · 서비스 ${review.serviceRating ?: '-'} · 시설 ${review.facilitiesRating ?: '-'} · 위치 ${review.locationRating ?: '-'}|">세부 평점</div>
            </div>
            <div class="col-12">
                <div class="text-muted small">리뷰 내용</div>
                <div class="p-3 rounded" style="background:#F8FAFC;white-space:pre-wrap;" th:text="${review.content ?: '(내용 없음)'}">내용</div>
            </div>
        </div>
    </div>

    <form th:action="@{'/owner/review/' + ${review.reviewId} + '/reply'}" method="post" class="card shadow-sm mb-4 p-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="row g-3">
            <div class="col-md-4">
                <label for="status" class="form-label">노출 상태</label>
                <select id="status" name="status" class="form-select">
                    <option value="PUBLISHED"
                            th:selected="${#strings.equalsIgnoreCase(review.status,'PUBLISHED') or #strings.equalsIgnoreCase(review.status,'VISIBLE')}">노출</option>
                    <option value="HIDDEN" th:selected="${#strings.equalsIgnoreCase(review.status,'HIDDEN')}">숨김</option>
                </select>
            </div>
            <div class="col-12">
                <label for="reply" class="form-label">숙소 답글</label>
                <textarea id="reply" name="reply" class="form-control" rows="4"
                          placeholder="답글을 입력하세요. 비우고 저장하면 답글이 지워집니다."
                          th:text="${review.reply}"></textarea>
            </div>
        </div>
        <div class="text-end mt-3">
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i> 저장</button>
        </div>
    </form>
</th:block>
</body>
</html>
