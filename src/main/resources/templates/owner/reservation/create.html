<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{owner/layout/base}">
<body>
<th:block layout:fragment="content">
    <div class="page-heading mb-4">
        <h3>예약 등록</h3>
        <p class="text-subtitle text-muted">회원과 객실을 고르면 결제 금액은 객실 요금 × 박 수로 계산됩니다.</p>
    </div>

    <div class="page-content">
        <form th:action="@{/owner/reservation/create}" method="post" class="needs-validation" id="reservationForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="card shadow-sm mb-4 p-4">
                <h5 class="mb-3">예약 정보</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="roomSelect" class="form-label">객실</label>
                        <select class="form-select" id="roomSelect" name="roomId" required>
                            <option value="">객실을 선택하세요</option>
                            <option th:each="r : ${rooms}" th:if="${r.status == 'ACTIVE'}"
                                    th:value="${r.roomId}"
                                    th:attr="data-price=${r.price}, data-max=${r.maxOccupancy}"
                                    th:text="${r.accommodationName + ' · ' + r.name}">숙소 · 객실</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="status" class="form-label">예약 상태</label>
                        <select name="status" id="status" class="form-select" required>
                            <option value="CONFIRMED">확정</option>
                            <option value="PENDING">대기</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="checkInDate" class="form-label">체크인 날짜</label>
                        <input type="date" name="checkInDate" class="form-control" id="checkInDate" required>
                    </div>
                    <div class="col-md-6">
                        <label for="checkOutDate" class="form-label">체크아웃 날짜</label>
                        <input type="date" name="checkOutDate" class="form-control" id="checkOutDate" required>
                    </div>
                    <div class="col-md-6">
                        <label for="reservationNumber" class="form-label">예약 번호 <small class="text-muted">(비우면 자동 생성)</small></label>
                        <input type="text" name="reservationNumber" class="form-control" id="reservationNumber">
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mb-4 p-4">
                <h5 class="mb-3">고객 정보</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="userSelect" class="form-label">회원</label>
                        <select class="form-select" id="userSelect" name="userId" required>
                            <option value="">회원을 선택하세요</option>
                            <option th:each="u : ${users}" th:value="${u.userId}"
                                    th:attr="data-name=${u.name}, data-phone=${u.phone}"
                                    th:text="${u.name + ' (' + (u.email ?: '-') + ')'}">홍길동</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="guestCount" class="form-label">투숙 인원</label>
                        <input type="number" name="guestCount" class="form-control" id="guestCount" min="1" value="2" required>
                    </div>
                    <div class="col-md-6">
                        <label for="guestName" class="form-label">투숙객 이름</label>
                        <input type="text" name="guestName" class="form-control" id="guestName" required>
                    </div>
                    <div class="col-md-6">
                        <label for="guestPhone" class="form-label">투숙객 전화번호</label>
                        <input type="text" name="guestPhone" class="form-control" id="guestPhone" required>
                    </div>
                    <div class="col-12">
                        <label for="specialRequest" class="form-label">요청 사항</label>
                        <textarea name="specialRequest" class="form-control" id="specialRequest" rows="2"></textarea>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mb-4 p-4">
                <h5 class="mb-3">가격 정보</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="originalPrice" class="form-label">객실 요금 × 박 수</label>
                        <input type="text" class="form-control" id="originalPrice" readonly>
                    </div>
                    <div class="col-md-4">
                        <label for="discountAmount" class="form-label">할인 금액</label>
                        <input type="number" name="discountAmount" class="form-control" id="discountAmount" min="0" step="100" value="0">
                    </div>
                    <div class="col-md-4">
                        <label for="price" class="form-label">최종 결제 금액</label>
                        <input type="text" class="form-control" id="price" readonly>
                    </div>
                </div>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save me-1"></i> 등록
                </button>
            </div>
        </form>
    </div>
</th:block>
<!-- 스크립트는 layout:fragment 안에 둔다 (밖은 layout dialect 가 버린다) -->
<th:block layout:fragment="script">
<script>
    (function () {
        const roomSelect = document.getElementById("roomSelect");
        const userSelect = document.getElementById("userSelect");
        const checkIn = document.getElementById("checkInDate");
        const checkOut = document.getElementById("checkOutDate");
        const guestCount = document.getElementById("guestCount");
        const discount = document.getElementById("discountAmount");
        const original = document.getElementById("originalPrice");
        const price = document.getElementById("price");
        const fmt = n => n.toLocaleString("ko-KR") + "원";

        function nights() {
            if (!checkIn.value || !checkOut.value) return 0;
            const d = (new Date(checkOut.value) - new Date(checkIn.value)) / 86400000;
            return d > 0 ? d : 0;
        }
        function recalc() {
            const opt = roomSelect.selectedOptions[0];
            const rate = opt && opt.dataset.price ? parseFloat(opt.dataset.price) : 0;
            const total = rate * nights();
            const dc = Math.min(Math.max(parseFloat(discount.value) || 0, 0), total);
            original.value = total ? fmt(total) + " (" + nights() + "박)" : "";
            price.value = total ? fmt(total - dc) : "";
            if (opt && opt.dataset.max) guestCount.max = opt.dataset.max;
        }
        userSelect.addEventListener("change", function () {
            const opt = userSelect.selectedOptions[0];
            if (!opt || !opt.value) return;
            document.getElementById("guestName").value = opt.dataset.name || "";
            document.getElementById("guestPhone").value = opt.dataset.phone || "";
        });
        [roomSelect, checkIn, checkOut, discount].forEach(el => el.addEventListener("input", recalc));
        roomSelect.addEventListener("change", recalc);
        document.getElementById("reservationForm").addEventListener("submit", function (e) {
            if (!nights()) {
                e.preventDefault();
                alert("체크아웃 날짜는 체크인 날짜 이후여야 합니다.");
            }
        });
    })();
</script>
</th:block>
</body>
</html>
