<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{owner/layout/base}">
<head>
    <title>취소 요청</title>
    <th:block layout:fragment="head">
        <style>
            .btn-chip { border-radius: var(--pill) !important; padding: .28rem .65rem; font-weight: 700; font-size: .82rem; }
            .reason { max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        </style>
    </th:block>
</head>
<body>
<!-- 취소 요청(CANCEL_REQUEST) 목록 -->
<th:block layout:fragment="content">
    <div class="toolbar">
        <div class="d-flex align-items-center gap-2">
            <h3 class="mb-0">취소 요청</h3>
            <span class="count-badge" th:text="'총 ' + ${reservationPage.total} + '건'">총 0건</span>
        </div>
        <a th:href="@{/owner/reservation/list}" class="btn btn-soft btn-chip">예약 목록</a>
    </div>

    <div class="card">
        <div class="card-body table-responsive p-0">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="ps-3 text-center hide-md">ID</th>
                    <th>예약자</th>
                    <th class="hide-sm">숙소 / 객실</th>
                    <th class="hide-sm">투숙 기간</th>
                    <th class="hide-md text-end">금액</th>
                    <th class="hide-md">취소 사유</th>
                    <th class="text-center">처리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="res : ${reservations}">
                    <td class="ps-3 text-center hide-md text-muted" style="font-size:.85rem;" th:text="${res.reservationId}">1</td>
                    <td>
                        <div class="fw-semibold" th:text="${res.guestName}">홍길동</div>
                        <div class="text-muted" style="font-size:.78rem;" th:text="${res.guestPhone ?: ''}">010-0000-0000</div>
                    </td>
                    <td class="hide-sm">
                        <div th:text="${res.accommodationName ?: '-'}">숙소</div>
                        <div class="text-muted" style="font-size:.78rem;" th:text="${res.roomName ?: ''}">객실</div>
                    </td>
                    <td class="hide-sm" style="font-size:.88rem;"
                        th:text="${res.checkInDate + ' ~ ' + res.checkOutDate}">2025-01-01 ~ 2025-01-02</td>
                    <td class="hide-md text-end fw-semibold"
                        th:text="${res.price != null ? #numbers.formatInteger(res.price, 1, 'COMMA') + '원' : '-'}">-</td>
                    <td class="hide-md"><div class="reason" th:title="${res.cancelReason}" th:text="${res.cancelReason ?: '-'}">사유</div></td>
                    <td class="text-center">
                        <div class="d-inline-flex gap-1">
                            <form th:action="@{'/owner/reservation/' + ${res.reservationId} + '/cancel-approve'}" method="post" class="d-inline"
                                  onsubmit="return confirm('취소를 승인하시겠습니까? 결제 금액이 환불됩니다.');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger-soft btn-chip">취소 승인</button>
                            </form>
                            <form th:action="@{'/owner/reservation/' + ${res.reservationId} + '/cancel-reject'}" method="post" class="d-inline"
                                  onsubmit="return confirm('취소 요청을 거절하고 예약을 유지하시겠습니까?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-ghost btn-chip">거절</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${reservations == null or #lists.isEmpty(reservations)}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-check2-circle d-block fs-2 mb-2"></i>
                        처리할 취소 요청이 없습니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer d-flex justify-content-between align-items-center" th:if="${reservationPage.total > 0}">
            <div class="text-muted" style="font-size:.85rem;">총 <span th:text="${reservationPage.total}">0</span>건</div>
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${!reservationPage.prev} ? 'disabled'">
                        <a class="page-link" th:href="@{/owner/reservation/inActive/list(page=${reservationPage.prevPage}, size=${reservationPage.pageRequestDTO.size})}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="num : ${reservationPage.pageNumList}"
                        th:classappend="${num == reservationPage.current} ? 'active'">
                        <a class="page-link" th:href="@{/owner/reservation/inActive/list(page=${num}, size=${reservationPage.pageRequestDTO.size})}" th:text="${num}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${!reservationPage.next} ? 'disabled'">
                        <a class="page-link" th:href="@{/owner/reservation/inActive/list(page=${reservationPage.nextPage}, size=${reservationPage.pageRequestDTO.size})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</th:block>
</body>
</html>
