<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{owner/layout/base}">

<body>
<th:block layout:fragment="content">
    <div class="page-heading mb-4">
        <h3>예약 수정</h3>
        <p class="text-subtitle text-muted">예약 정보를 수정합니다.</p>
    </div>

    <div class="page-content">
        <form th:action="@{/owner/reservation/modify}" method="post" class="needs-validation" >
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="reservationId" th:value="${reservation.reservationId}" />

            <!-- 예약 기본 정보 -->
            <div class="card shadow-sm mb-4 p-4">
                <h5 class="mb-3">기본 정보</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">예약 번호</label>
                        <input type="text" name="reservationNumber" class="form-control" th:value="${reservation.reservationNumber}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">예약 상태</label>
                        <select name="status" class="form-select" required>
                            <option value="PENDING" th:selected="${reservation.status == 'PENDING'}">대기</option>
                            <option value="CONFIRMED" th:selected="${reservation.status == 'CONFIRMED'}">확정</option>
                            <option value="CANCEL_REQUEST" th:selected="${reservation.status == 'CANCEL_REQUEST'}">취소 요청</option>
                            <option value="COMPLETED" th:selected="${reservation.status == 'COMPLETED'}">이용 완료</option>
                            <option value="NO_SHOW" th:selected="${reservation.status == 'NO_SHOW'}">노쇼</option>
                            <option value="CANCELLED" th:selected="${reservation.status == 'CANCELLED'}">취소</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mt-3">
                    <div class="col-md-6">
                        <label class="form-label">체크인 날짜</label>
                        <input type="date" name="checkInDate" class="form-control" th:value="${reservation.checkInDate}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">체크아웃 날짜</label>
                        <input type="date" name="checkOutDate" class="form-control" th:value="${reservation.checkOutDate}" required>
                    </div>
                </div>
            </div>

            <!-- 고객 정보 -->
            <div class="card shadow-sm mb-4 p-4">
                <h5 class="mb-3">고객 정보</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">고객 이름</label>
                        <input type="text" name="guestName" class="form-control" th:value="${reservation.guestName}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">고객 전화번호</label>
                        <input type="text" name="guestPhone" class="form-control" th:value="${reservation.guestPhone}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">인원 수</label>
                        <input type="number" name="guestCount" class="form-control" th:value="${reservation.guestCount}" required>
                    </div>
                </div>
            </div>

            <!-- 숙소 및 객실 정보 (숙소 ID 는 선택한 객실에서 채운다) -->
            <div class="card shadow-sm mb-4 p-4">
                <h5 class="mb-3">숙소 및 객실 정보</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="roomSelect">객실</label>
                        <select id="roomSelect" name="roomId" class="form-select" required>
                            <option th:each="r : ${rooms}"
                                    th:value="${r.roomId}"
                                    th:attr="data-accommodation-id=${r.accommodationId}"
                                    th:text="${r.accommodationName + ' · ' + r.name}"
                                    th:selected="${r.roomId == reservation.roomId}">숙소 · 객실</option>
                        </select>
                        <input type="hidden" id="accommodationId" name="accommodationId" th:value="${reservation.accommodationId}">
                        <div class="form-text">객실을 바꾸면 해당 기간 재고를 다시 확인합니다.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">예약 당시 숙소 / 객실명</label>
                        <input type="text" class="form-control" th:value="${reservation.accommodationName + ' / ' + reservation.roomName}" readonly>
                    </div>
                </div>
            </div>

            <!-- 가격 정보: 예약 시점 결제 스냅샷이라 수정되지 않는다 (서버도 저장하지 않음) -->
            <div class="card shadow-sm mb-4 p-4">
                <h5 class="mb-3">가격 정보 <small class="text-muted fw-normal" style="font-size:.8rem;">결제 시점 금액 (읽기 전용)</small></h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">원래 가격</label>
                        <input type="text" class="form-control" readonly
                               th:value="${reservation.originalPrice != null ? #numbers.formatInteger(reservation.originalPrice, 1, 'COMMA') + '원' : '-'}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">할인 금액</label>
                        <input type="text" class="form-control" readonly
                               th:value="${reservation.discountAmount != null ? #numbers.formatInteger(reservation.discountAmount, 1, 'COMMA') + '원' : '-'}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">최종 가격</label>
                        <input type="text" class="form-control" readonly
                               th:value="${reservation.price != null ? #numbers.formatInteger(reservation.price, 1, 'COMMA') + '원' : '-'}">
                    </div>
                </div>
            </div>

            <!-- 기타 -->
            <div class="card shadow-sm mb-4 p-4">
                <h5 class="mb-3">기타 정보</h5>
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label">요청 사항</label>
                        <textarea name="specialRequest" class="form-control" rows="2" th:text="${reservation.specialRequest}"></textarea>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">취소 사유</label>
                        <textarea name="cancelReason" class="form-control" rows="2" th:text="${reservation.cancelReason}"></textarea>
                    </div>
                </div>
            </div>

            <!-- 사용자 정보 -->
            <input type="hidden" name="userId" th:value="${reservation.userId}" />

            <div class="text-end">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save me-1"></i> 저장
                </button>
            </div>
        </form>
    </div>
</th:block>
<th:block layout:fragment="script">
<script>
    // 선택한 객실의 숙소 ID 를 함께 보낸다
    (function () {
        const roomSelect = document.getElementById("roomSelect");
        const accInput = document.getElementById("accommodationId");
        if (!roomSelect || !accInput) return;
        roomSelect.addEventListener("change", function () {
            const opt = roomSelect.options[roomSelect.selectedIndex];
            if (opt && opt.dataset.accommodationId) accInput.value = opt.dataset.accommodationId;
        });
    })();
</script>
</th:block>
</body>
</html>
