<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout/blank}">
<head>
    <meta charset="UTF-8">
    <title layout:fragment="title">로그인 | HoneyRest</title>
    <th:block layout:fragment="head">
        <link rel="stylesheet" th:href="@{/assets/css/honey-theme.css}" />
        <style>
            body { background: linear-gradient(135deg, #FFF8E1 0%, #FFE082 40%, #FFD54F 100%) !important; }
        </style>
    </th:block>
</head>
<body>
<th:block layout:fragment="content">
    <div class="login-wrapper">
        <div class="login-card-honey">
            <div class="login-logo">
                <span class="logo-icon">🍯</span>
                <h1>HoneyRest</h1>
                <p>호스트 관리 시스템</p>
            </div>

            <form method="post" th:action="@{/auth/login}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <input type="email" class="form-control" id="email"
                           name="email" placeholder="관리자 이메일 입력"
                           required autocomplete="username" />
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" class="form-control" id="password"
                           name="password" placeholder="비밀번호 입력"
                           required autocomplete="current-password" />
                </div>

                <button type="submit" class="btn btn-login">로그인</button>
            </form>

            <div th:if="${param.error}" class="alert mt-3 p-2 text-center"
                 style="background:#FEE2E2;color:#DC2626;border-radius:10px;font-size:.9rem;">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.logout}" class="alert mt-3 p-2 text-center"
                 style="background:#DCFCE7;color:#16A34A;border-radius:10px;font-size:.9rem;">
                로그아웃되었습니다.
            </div>

            <!-- 데모 계정 안내 (demo 프로필에서만 목록이 채워진다: app.demo.login-accounts) -->
            <div th:if="${demoAccounts != null and !demoAccounts.isEmpty()}" class="mt-4 p-3" data-testid="demo-accounts"
                 style="background:#FFFBEB;border:1px dashed #F59E0B;border-radius:12px;font-size:.85rem;">
                <p class="mb-2" style="font-weight:700;color:#92400E;">데모 계정 (클릭하면 입력됩니다)</p>
                <p class="mb-2" style="color:#78716C;font-size:.78rem;">
                    데모 환경입니다. 데이터는 재시작 시 초기화되며, 사용자 사이트와 DB 가 분리되어 있어 여기서 바꾼 내용은 사용자 사이트에 반영되지 않습니다.
                </p>
                <button type="button" th:each="acc : ${demoAccounts}"
                        class="btn btn-sm w-100 mb-2 text-start demo-account-fill"
                        style="background:#fff;border:1px solid #FCD34D;border-radius:10px;"
                        th:data-email="${acc.email}" th:data-password="${acc.password}">
                    <strong th:text="${acc.label}">업체 관리자</strong><br>
                    <span th:text="${acc.email}">company@example.com</span>
                    <span style="color:#A8A29E;"> / </span>
                    <span th:text="${acc.password}">password</span>
                </button>
            </div>
        </div>
    </div>
</th:block>
<th:block layout:fragment="script">
    <script th:if="${demoAccounts != null and !demoAccounts.isEmpty()}">
        document.querySelectorAll('.demo-account-fill').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.getElementById('email').value = btn.dataset.email;
                document.getElementById('password').value = btn.dataset.password;
            });
        });
    </script>
</th:block>
</body>
</html>
